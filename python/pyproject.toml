[project]
name = "stockdatum-example"
version = "0.1.0"
description = "Example x402 client for the StockDatum Filings API."
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "x402[evm,httpx]==2.29.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.407",
  "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
